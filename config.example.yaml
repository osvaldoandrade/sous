cluster_name: cs-prod-1
environment: prod

plugins:
  authn:
    driver: tikti
    tikti:
      introspection_url: http://localhost:8099/introspect
      cache_ttl_seconds: 60
      api_key: ""
  persistence:
    driver: kvrocks
    kvrocks:
      addr: localhost:6666
      auth:
        mode: none
        password: ""
  messaging:
    driver: codeq
    codeq:
      base_url: http://localhost:8080
      producer_token: ""
      worker_token: ""
      # Legacy transport (Kafka-compatible) can still be enabled with brokers.
      brokers: []
      topics:
        invoke: cs.invoke
        results: cs.results
        dlq_invoke: cs.dlq.invoke
        dlq_results: cs.dlq.results
  audit:
    # E6.03: control-plane audit log stream. Sink drivers:
    #   stdout  - one JSON line per event on cs-control stdout (default).
    #   codeq   - publish to <topic_prefix>.<tenant>.
    #   webhook - HMAC-signed POST to webhook_url.
    sink: stdout
    topic_prefix: cs.audit
    webhook_url: ""
    hmac_secret: ""
    history_limit: 1000
  secrets:
    # E6.01: external secret-provider plugin. The default driver
    # "memory" reads from the seed map below and is intended for local
    # development and tests. Production deployments select "vault" to
    # delegate to a HashiCorp Vault KV v2 cluster — see
    # docs/15-security.md "Secrets" and docs/20-config-reference.md.
    driver: memory
    memory:
      # Map of <path> -> <value>. A VersionConfig.Secrets entry like
      # "STRIPE_KEY=payments/stripe_key" looks up seed["payments/stripe_key"]
      # and exposes the result to user code as cs.env.get("STRIPE_KEY").
      seed: {}
    vault:
      # Base URL of the Vault cluster. Required when driver == "vault".
      addr: ""
      # Static auth token. Prefer leaving this empty and exporting the
      # value via the token_env variable so the YAML stays sealed.
      token: ""
      token_env: VAULT_TOKEN
      # KV v2 mount. The driver rewrites SecretRef.Path to
      # "<kv_mount>/data/<path>" before issuing the request.
      kv_mount: secret
      # Vault Enterprise namespace forwarded as X-Vault-Namespace.
      namespace: ""
      # Per-request timeout. Bounded by the activation deadline.
      timeout_ms: 2000
  signing:
    # E5.02 publish-time signature enforcement. Default false keeps the
    # pre-E5.02 contract: signatures are recorded when provided but not
    # required. Flip to true once every active tenant has rotated a
    # signing key; the publish handler then rejects unsigned uploads
    # with CS_SIGNATURE_MISSING. See docs/15-security.md.
    required: false

# Legacy compatibility fields (optional during migration window).
kvrocks:
  addr: localhost:6666
  auth:
    mode: none
    password: ""

codeq:
  base_url: http://localhost:8080
  producer_token: ""
  worker_token: ""
  brokers: []
  topics:
    invoke: cs.invoke
    results: cs.results
    dlq_invoke: cs.dlq.invoke
    dlq_results: cs.dlq.results

tikti:
  introspection_url: http://localhost:8099/introspect
  cache_ttl_seconds: 60
  api_key: ""

cs_control:
  http:
    addr: :8080
  limits:
    max_bundle_bytes: 16777216
    draft_ttl_seconds: 86400
    activation_ttl_seconds: 604800
  subscriptions:
    # E4.02 codeQ subscription trigger. cs-control starts an in-process
    # consumer per enabled SubscriptionBinding and reconciles the set on
    # this interval. worker_pool_default seeds max_concurrency for new
    # unordered bindings; ordered bindings always run with a single
    # goroutine. See docs/07-codeq-protocol.md.
    worker_pool_default: 4
    refresh_seconds: 10
  publish:
    # E5.01: frozen-import-map resolver. The allowlist is empty by
    # default so no remote fetching is permitted; only local-path
    # imports resolve. Add hostnames (no scheme, no port) here to opt
    # into a curated mirror. See docs/08-runtime-cs-js.md and
    # docs/15-security.md.
    imports:
      allowed_mirrors: []
      max_bytes_per_import: 4194304
      timeout_ms: 10000

cs_http_gateway:
  http:
    addr: :8081
  limits:
    max_body_bytes: 6291456
    max_header_bytes: 65536
    max_query_bytes: 16384
  rate_limits:
    # E1.04: per-tenant token bucket. When the bucket is empty the gateway
    # responds 429 CS_RATE_LIMITED with a Retry-After header. tenant_burst
    # defaults to tenant_rps when omitted.
    tenant_rps: 200
    function_rps: 20

cs_invoker_pool:
  http:
    addr: :8082
  workers:
    # E1.04: max_inflight is the global concurrency cap inside one replica.
    # The per-tenant cap is fixed at internal/limits.DefaultTenantMaxInflight
    # (64) and can be overridden at process start with the env var
    # CS_INVOKER_TENANT_INFLIGHT until a dedicated YAML key is added.
    threads: 32
    max_inflight: 2048
  cache:
    bundles_max: 1000
    bytes_max: 536870912
  limits:
    max_result_bytes: 262144
    max_error_bytes: 65536
    max_log_bytes: 1048576
  # E4.03: trigger-level retry & DLQ defaults applied to async invocations
  # (schedule, subscription, cadence). HTTP is excluded — the client owns
  # retry for synchronous triggers. See docs/02-requirements.md
  # "Retry & DLQ" and docs/07-codeq-protocol.md for the envelope shape.
  retry:
    max_attempts: 1          # 1 disables retry; matches pre-E4.03 behaviour
    base_ms: 500
    max_ms: 30000
    jitter_pct: 20
    retryable_errors:
      - CS_RUNTIME_TIMEOUT
      - CS_RUNTIME_DEPENDENCY_ERROR
      - CS_RATE_LIMITED
      - Timeout
    dlq_topic: ""            # empty = use platform-default cs.dlq.invoke

# E7.02: activation sampling lives on each trigger record, not in this
# YAML. The example below shows the shape cs-control accepts when
# creating an HTTP trigger; see docs/14-observability.md and
# docs/20-config-reference.md for the full reference.
#
# trigger:
#   type: http
#   source:
#     method: POST
#     path: /webhook
#   sampling:
#     mode: tail            # always (default) | head | tail | probabilistic
#     head_per_minute: 50   # required when mode == head
#     tail_on_error: true   # required (with tail_on_slow_ms) when mode == tail
#     tail_on_slow_ms: 250
#     probability: 0.05     # required when mode == probabilistic

cs_scheduler:
  tick_ms: 1000
  max_catchup_ticks: 60
  leader_election:
    enabled: true
    lease_name: cs-scheduler

cs_cadence_poller:
  cadence:
    addr: localhost:7933
  refresh_seconds: 10
  heartbeat:
    max_per_second: 2
  limits:
    max_inflight_tasks_default: 256
